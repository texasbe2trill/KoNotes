<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#1a1a2e"/>
  <g transform="translate(40, 30)">
    <!-- Book silhouette -->
    <rect x="10" y="20" width="100" height="120" rx="6" fill="#e2e2e2" opacity="0.9"/>
    <rect x="14" y="24" width="92" height="112" rx="4" fill="#1a1a2e"/>
    <!-- Spine -->
    <rect x="10" y="20" width="8" height="120" rx="3" fill="#4a9eff"/>
    <!-- Page lines -->
    <line x1="30" y1="50" x2="95" y2="50" stroke="#4a9eff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="30" y1="65" x2="90" y2="65" stroke="#4a9eff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="30" y1="80" x2="85" y2="80" stroke="#4a9eff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <!-- Highlight marker -->
    <rect x="28" y="95" width="50" height="14" rx="3" fill="#4a9eff" opacity="0.3"/>
    <line x1="30" y1="102" x2="75" y2="102" stroke="#4a9eff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- KN monogram -->
  <text x="100" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" fill="#4a9eff" letter-spacing="4">KN</text>
</svg>
