[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "konotes"
version = "0.2.0"
requires-python = ">=3.12"
description = "KoNotes turns your Kobo highlights and reading data into structured, readable insight."
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "streamlit>=1.35.0",
    "pydantic>=2.7.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[project.scripts]
konotes = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "models*", "parser*", "services*", "utils*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
