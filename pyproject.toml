[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "konotes"
version = "0.7.0"
requires-python = ">=3.12"
description = "KoNotes turns your Kobo & Kindle highlights and reading data into structured, readable insight."
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "streamlit>=1.35.0",
    "pydantic>=2.7.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0",
    "plotly>=5.20.0,<6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]
ai = ["sentence-transformers>=2.7.0", "scikit-learn>=1.5.0", "numpy>=1.26.0", "torchvision>=0.26.0"]
chat = ["openai>=1.0.0"]

[project.scripts]
konotes = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "models*", "parser*", "services*", "utils*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
